name: Migo HQM Server Build

on:
  push:
    branches:
      - master
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
  workflow_dispatch:
    inputs:
      all-targets:
        description: Build every release target instead of only the common ones
        type: boolean
        default: false

env:
  BIN: migo-hqm-server
  # Linux and FreeBSD targets are cross-compiled with cargo-zigbuild, using zig as the C compiler and linker
  ZIG_VERSION: 0.17.0
  CARGO_ZIGBUILD_VERSION: 0.24.1

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      # Releases and manual all-targets runs build every target; other builds only those marked "common"
      - name: Choose targets
        id: platforms
        env:
          ALL_TARGETS: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.all-targets }}
        run: |
          platforms='[
            {"target": "x86_64-pc-windows-msvc", "os": "windows-latest", "common": true},
            {"target": "aarch64-pc-windows-msvc", "os": "windows-latest"},
            {"target": "x86_64-apple-darwin", "os": "macos-latest"},
            {"target": "aarch64-apple-darwin", "os": "macos-latest"},
            {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-latest", "common": true},
            {"target": "aarch64-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "armv7-unknown-linux-gnueabihf", "os": "ubuntu-latest"},
            {"target": "armv7-unknown-linux-musleabihf", "os": "ubuntu-latest"},
            {"target": "arm-unknown-linux-gnueabihf", "os": "ubuntu-latest"},
            {"target": "arm-unknown-linux-musleabihf", "os": "ubuntu-latest"},
            {"target": "i686-unknown-linux-gnu", "os": "ubuntu-latest"},
            {"target": "i686-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "i686-unknown-freebsd", "os": "ubuntu-latest"},
            {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-latest", "common": true},
            {"target": "x86_64-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "x86_64-unknown-freebsd", "os": "ubuntu-latest"},
            {"target": "x86_64-unknown-netbsd", "os": "ubuntu-latest"},
            {"target": "riscv64gc-unknown-linux-gnu", "os": "ubuntu-latest"},
            {"target": "riscv64gc-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "loongarch64-unknown-linux-gnu", "os": "ubuntu-latest", "max-glibc": "2.36"},
            {"target": "loongarch64-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "powerpc64le-unknown-linux-gnu", "os": "ubuntu-latest", "max-glibc": "2.34"},
            {"target": "powerpc64le-unknown-linux-musl", "os": "ubuntu-latest"},
            {"target": "s390x-unknown-linux-gnu", "os": "ubuntu-latest"}
          ]'
          if [ "$ALL_TARGETS" != "true" ]; then
            platforms=$(jq 'map(select(.common))' <<< "$platforms")
          fi
          echo "platforms=$(jq -c . <<< "$platforms")" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked

  build:
    name: build (${{ matrix.platform.target }})
    needs: setup
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.platform.target }}
          rustup default stable
        shell: bash
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.platform.target }}
          # Tag builds can only read caches from their own tag or the default branch, so only master saves them
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install zig and cargo-zigbuild
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install "ziglang==$ZIG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
          # cargo-zigbuild finds zig through "python3 -m ziglang", so the venv's python3 must come first on PATH
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Build binary
        if: matrix.platform.os != 'ubuntu-latest'
        run: cargo build --locked --release --target ${{ matrix.platform.target }}
        shell: bash
      # glibc policy (see "Linux requirements" in README.md): linux-gnu binaries must run on glibc 2.28,
      # or on the first glibc that supports the architecture if that is newer (set with "max-glibc").
      # zigbuild links linux-gnu targets against the glibc version given as a suffix on the target name.
      - name: Build binary with cargo-zigbuild
        if: matrix.platform.os == 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.platform.target }}
          MAX_GLIBC: ${{ matrix.platform.max-glibc || '2.28' }}
        run: |
          zig_target="$TARGET"
          if [[ "$TARGET" == *-linux-gnu* ]]; then
            zig_target="$TARGET.$MAX_GLIBC"
          fi
          cargo zigbuild --locked --release --target "$zig_target"
        shell: bash
      - name: Check required glibc version
        if: contains(matrix.platform.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.platform.max-glibc || '2.28' }}
        run: |
          required=$(readelf --dyn-syms --wide target/${{ matrix.platform.target }}/release/migo-hqm-server | grep -o 'GLIBC_2\.[0-9]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
          echo "Binary requires glibc $required, the limit is $MAX_GLIBC"
          if [ "$(printf '%s\n' "$required" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "::error::Binary requires glibc $required, newer than the allowed $MAX_GLIBC"
            exit 1
          fi
        shell: bash
      - run: |
          7z a migo-hqm-server-${{ matrix.platform.target }}.zip config.toml README.md example_replay_integration.py ".\target\${{ matrix.platform.target }}\release\migo-hqm-server.exe"
        shell: bash
        if: matrix.platform.os == 'windows-latest'
      - run: |
          tar -czvf migo-hqm-server-${{ matrix.platform.target }}.tar.gz config.toml README.md example_replay_integration.py -C target/${{ matrix.platform.target }}/release migo-hqm-server
        shell: bash
        if: matrix.platform.os != 'windows-latest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migo-hqm-server-${{ matrix.platform.target }}
          path: migo-hqm-server-${{ matrix.platform.target }}.*
          if-no-files-found: error

  # Publishes only after every target has built and the tests pass, so a release never has missing files or failing tests
  release:
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: migo-hqm-server-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/migo-hqm-server-*
          generate_release_notes: true
          fail_on_unmatched_files: true
