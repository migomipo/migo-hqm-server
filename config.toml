[server]
name = "HQM Server"
port = 27585
# log_name = "server.log"
# Custom log name prefix.
public = true
team_max = 5
player_max = 15
# password = "change-me"
# Set a password to let players log in as administrator with /admin. Without
# one, administrator login is disabled.
welcome = """
Welcome message 1
Welcome message 2
"""
# service = "hqm@config"
# If you use a Linux- and systemd-based system, you can restart the service with
# the in-game command /serverrestart. This requires setting service to the name
# of the systemd unit the service will run as.
# ban_file = "ban.txt"
mode = "match"

[game]
spawn = "center"
offside = "off"
# offside = "on" enables offside.
# offside = "immediate" enables offside, but calls offside directly when the
# puck enters the offensive zone.
icing = "off"
# icing = "on" enables icing.
# icing = "notouch" enables IIHF-style icing, called directly when the puck
# crosses the goal line.
time_period = 300
time_break = 10
time_intermission = 20
warmup_pucks = 16

[physics]
limit_jump_speed = false
