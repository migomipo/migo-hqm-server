[server]
name = "HQM Server"
port = 27585
# log_name = "server.log"
# Custom log name prefix.
# log_output = "auto"
# Where log messages go: "file" for daily log files in the "log" folder,
# "stdout" for standard output, or "auto" (the default) for systemd's journal
# when running as a systemd service and log files otherwise.
# log_retention_days = 30
# How many daily log files to keep. 0 keeps them all.
public = true
team_max = 5
player_max = 15
# password = "change-me"
# Set a password to let players log in as administrator with /admin. Without
# one, administrator login is disabled.
welcome = """
Welcome message 1
Welcome message 2
"""
# supervised = true
# Lets administrators restart the server with /serverrestart, which makes the
# server shut down and exit with code 75 so that a supervisor such as systemd or
# Docker starts it again. This is on by default when the server runs from the
# hqm@.service unit that comes with it, and off otherwise.
# ban_file = "ban.txt"
mode = "match"

[game]
spawn = "center"
offside = "off"
# offside = "on" enables offside.
# offside = "immediate" enables offside, but calls offside directly when the
# puck enters the offensive zone.
icing = "off"
# icing = "on" enables icing.
# icing = "notouch" enables IIHF-style icing, called directly when the puck
# crosses the goal line.
time_period = 300
time_break = 10
time_intermission = 20
warmup_pucks = 16

[physics]
limit_jump_speed = false
